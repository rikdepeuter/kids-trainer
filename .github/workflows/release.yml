name: Release

# Push a semver tag to release, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ---------------------------------------------------------------------------
  # Changelog + GitHub Release: release notes are generated from conventional
  # commits (feat/fix/perf) since the previous tag; CHANGELOG.md is updated on
  # main and the notes become the GitHub Release body.
  # ---------------------------------------------------------------------------
  changelog:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate changelog from conventional commits
        run: |
          npx -y -p conventional-changelog-cli conventional-changelog -p angular -r 0 > FULL_RAW.md
          awk '/^#{1,2} \[\]/{skip=1; next} /^#{1,2} \[?[0-9]/{skip=0} !skip{print}' FULL_RAW.md > FULL.md
          awk '/^#{1,2} \[?[0-9]/{count++} count==2{exit} count>=1{print}' FULL.md > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Update CHANGELOG.md on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          {
            echo "# Changelog"
            echo
            echo "All notable changes to this project are documented in this file."
            echo "Generated from [Conventional Commits](https://www.conventionalcommits.org)"
            echo '(`feat:`, `fix:`, `perf:`) by the release pipeline on every `v*` tag.'
            echo
          } > CHANGELOG.md
          cat FULL.md >> CHANGELOG.md
          git add CHANGELOG.md
          git commit -m "docs: update changelog for ${GITHUB_REF_NAME} [skip ci]" || echo "No changelog changes"
          git push origin main

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md || echo "Release already exists"

  # ---------------------------------------------------------------------------
  # Webapp: build Vite SPA and deploy to GitHub Pages.
  # Install on Android: open https://rikdepeuter.github.io/kids-trainer/ in
  # Chrome, tap the menu → "Add to Home Screen".
  # ---------------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: changelog
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
